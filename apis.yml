    type: Documentation
  - url: https://zapier.com/apps/ruzuku/integrations
    type: SignupURL
  endpointsModeled: true
  description: >-
    Student lifecycle actions exposed through Ruzuku's Zapier integration - enroll
    a student in a course, unenroll a student, and find a student by email or ID.
    Authentication uses an API Key, API Secret, and Site URL generated in the
    Ruzuku dashboard under Account then Integrations then Configure Zapier. Ruzuku
    does not publish a direct public REST reference or base URL for these actions;
    they are honestly modeled from the Zapier connector, not from vendor API docs.
- aid: ruzuku:ruzuku-activity-events-api
  name: Ruzuku Activity Events API
  tags:
  - Events
  - Webhooks
  - Triggers
  - Zapier
  - Gated
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://zapier.com/apps/ruzuku/integrations
  properties:
  - url: https://support.ruzuku.com/article/796-how-to-set-up-your-zapier-intergration
    type: Documentation
  - url: https://zapier.com/apps/ruzuku/integrations
    type: SignupURL
  endpointsModeled: true
  description: >-
    Course-activity event triggers surfaced through Ruzuku's Zapier integration -
    New Student Enrolled (with pricing and coupon data), Lesson Completed, Course
    Completed, Quiz Submitted (with score), Assignment Submitted (with answers),
    Comment Posted, and Subscription Canceled. Each event carries student and
    course details and many can be filtered to a specific course or lesson. These
    are Zapier-mediated triggers, not a documented public webhook or REST API on
    Ruzuku; the surface is modeled honestly from the connector.

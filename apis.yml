aid: ruzuku
url: https://raw.githubusercontent.com/api-evangelist/ruzuku/refs/heads/main/apis.yml
name: Ruzuku
kind: company
description: >-
  Ruzuku is a hosted online course platform for coaches, authors, and subject
  matter experts to create, teach, and sell online courses and learning
  communities. Ruzuku does not publish a documented public REST API or
  developer program. Its programmatic surface is exposed exclusively through a
  Zapier integration - authenticated with an API Key, API Secret, and Site URL
  generated under Account then Integrations then Configure Zapier - that offers
  event triggers (enrollments, lesson and course completions, quiz and
  assignment submissions, comments, cancellations) and a small set of student
  enroll, unenroll, and lookup actions. The APIs modeled below are honest
  logical groupings of that Zapier-mediated surface, not endpoints from a public
  Ruzuku API reference.
